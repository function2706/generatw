main: # 画面種別(名称任意)
  ignition:
    any: ["today:"] # any は論理和, all は論理積
  character: # 項目名は多層的でも構わない
    name:
      pattern: "[0-9]{2},\\s(\\w*)" # 必ずバックスラッシュはエスケープ, 可変長後読みは禁止
      priority: 4 # 小さい数字ほどプロンプトの先頭に追加される, かぶれば上にある方, 未指定の場合は優先度最低
      capturegrp: 1
      lifetime: stable # stable の場合はルールを超越する, volatile の場合はルール内でのみプロンプト化される
      maps: # maps は <substr>: <prompt>
        Name1: name1,feature1 # Name1 等に抜き出した文字列を指定
        Name2:
          positive: name2,feature2
          negative: NAME2
    vibe:
      pattern: "vibe:\\s([^\\)]*)"
      priority: 2
      capturegrp: 1 # 未指定時は 0, キャプチャグループのインデックスを指定(0 は全体)
      lifetime: stable # stable 同士を持ち越す場合は priority に従い, volatile よりも前に配置する
      maps:
        Vibe1: vibe1
        Vibe2: vibe2
      default: vibe3 # マッチがない場合のプロンプト定義, これがない場合はマッチしなければプロンプト化しない
  meta:
    date:
      pattern: "(1|2)[0-9]{3}/([0-9]{2})" # (a|b) の () もキャプチャであることに注意
      priority: 1
      capturegrp: 2
      lifetime: stable
      ranges: # ranges は <prompt>: [<substr1>,...]
        spring: ["03", "04", "05", "06"] # 値に一致する場合はすべてキーをプロンプトとする
        summer: ["07", "08"] # 数値は必ずダブルクォートで囲むこと(07 は "7" になる)
        autumn: ["09", "10"]
        winter:
          conditions: ["11", "12", "01", "02"]
          negative: HOT
    weather:
      pattern: "(sunny|rainy)"
      priority: 4
      maps:
        sunny: sunny
        rainy: rainy
      default: cloudy
  test:
    foobar:
      pattern: "(foo|bar|Bar|Baz|baz)"
      priority: 1
      maps:
        foo:
          positive: foo
          negative: FOO,(nope:1.1)
        bar:
          positive: (bar:1.3)
          negative: BAR,(nope:1.2),nyome
        Bar:
          positive: (bar:1.1) # token が被った場合, weight は最大のものを1つだけ採用
          negative: BAR,(nope:1.2)
        Baz:
          negative: BAZ,(nope:1.4)
        baz:
          positive: baz
    hogefuga:
      pattern: "([hH]oge|[fF]uga)"
      ranges:
        (hoge:1.3): # token が被った場合, weight は最大のものを1つだけ採用
          conditions: ["hoge"]
          negative: HOGE,nope
        (hoge:1.2):
          conditions: ["Hoge"]
        fuga:
          conditions: ["fuga", "Fuga"]
          negative: FUGA,(nope:1.3) # token が被った場合, weight は最大のものを1つだけ採用
  POSITIVE: "common positive" # この値は必ずポジティブプロンプトの末尾に追加される
  NEGATIVE: "common negative" # この値は必ずネガティブプロンプトの末尾に追加される
sub:
  ignition:
    all: ["sub:", "WOW"]
  mood:
    pattern: "mood:\\s([^\\)]*)\\s"
    priority: 1
    capturegrp: 1
    maps:
      Mood1: mood1
      Mood2:
        positive: mood2
        negative: MOOD2
    default: mood3
  equipment:
    pattern: "equip:\\s([^\\)]*)\\s"
    priority: 2
    capturegrp: 1
    ranges:
      shirt: ["Blouse, Shirt"]
      (pants:1.2): ["Pants"]
      pants:
        conditions: ["Shorts", "Slacks"]
        negative: "skirt"
      caps: ["Caps"]
  POSITIVE: "sub common positive"
  NEGATIVE: "sub common negative"
