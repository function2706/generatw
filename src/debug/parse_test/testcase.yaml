empty_test:
  ignition:
    any: [""]
  minimal_field:
    pattern: ".*"
    maps:
      "": "" # 空文字のキーと値
  no_negative_field:
    pattern: "test"
    maps:
      key:
        positive: "pos_only" # negativeキー自体が存在しない
  POSITIVE: ""
  NEGATIVE: ""
regex_test:
  ignition:
    all: ["start"]
  token_check:
    pattern: "id:(\\d+)"
    maps:
      "1": "master-piece, (soft focus:1.2), (v1.5:0.8)"
      "2": "(long-hair:1.5), (flat:2), (sketch:.5)" # 整数重みや点始まり
      "3": "token with space:1.1" # トークン名にスペースが含まれる（Regexの境界）
nest_test:
  level1:
    ignored_list: ["not", "a", "field"]
    level2:
      target_field: # ここにFieldがある
        pattern: "nest"
        ranges:
          "found": ["nest"]
      level3:
        level4:
          deep_field:
            pattern: "deep"
            maps:
              "x": "y"
type_ambiguity:
  ignition:
    any: [123, True] # YAMLはこれらをintやboolとして読み込む
  field_1:
    pattern: "(\\d+)"
    capturegrp: "1" # 文字列で渡してみる
    maps:
      100: "hundred" # キーが数値（int）になる
      "200": "two-hundred" # キーが文字列
    default:
      positive: "def"
      negative: 777 # 値が数値
basic_sort:
  # ケース1: 基本的な昇順ソート
  # 期待される順序: high_prio (1) -> mid_prio (5) -> low_prio (10)
  low_prio:
    pattern: "low"
    priority: 10
    maps: { "low": "prompt_low" }
  high_prio:
    pattern: "high"
    priority: 1
    maps: { "high": "prompt_high" }
  mid_prio:
    pattern: "mid"
    priority: 5
    maps: { "mid": "prompt_mid" }
default_prio:
  # ケース2: 未指定（デフォルト -1）の扱い
  # 期待される順序: specified (1) -> unspec_1 (-1) -> unspec_2 (-1)
  # ※ -1 は「一番最後」に来る必要がある
  unspec_1:
    pattern: "un1"
    # priority 未指定
    maps: { "un1": "prompt_un1" }
  specified:
    pattern: "spec"
    priority: 1
    maps: { "spec": "prompt_spec" }
  unspec_2:
    pattern: "un2"
    # priority 未指定
    maps: { "un2": "prompt_un2" }
tie_break:
  # ケース3: 同じ優先順位のタイブレーク
  # 期待される順序: same_1 (2) -> same_2 (2) -> same_3 (2)
  # ※ 同じ数字なら「YAMLで上にある方」が先
  same_1:
    pattern: "s1"
    priority: 2
    maps: { "s1": "prompt_s1" }
  same_2:
    pattern: "s2"
    priority: 2
    maps: { "s2": "prompt_s2" }
  same_3:
    pattern: "s3"
    priority: 2
    maps: { "s3": "prompt_s3" }
random:
  random_0:
    pattern: "r0"
    priority: 4
    maps: { "r0": "prompt_r0" }
  random_1:
    pattern: "r1"
    priority: 100
    maps: { "r1": "prompt_r1" }
  random_2:
    pattern: "r2"
    priority: 2
    maps: { "r2": "prompt_r2" }
  random_3:
    pattern: "r1"
    priority: -1
    maps: { "r3": "prompt_r3" }
  random_4:
    pattern: "r4"
    priority: 2
    maps: { "r4": "prompt_r4" }
  random_5:
    pattern: "r5"
    priority: 1
    maps: { "r5": "prompt_r5" }
  random_6:
    pattern: "r6"
    priority: 1
    maps: { "r6": "prompt_r6" }
  random_7:
    pattern: "r7"
    priority: 6
    maps: { "r7": "prompt_r7" }
  random_8:
    pattern: "r8"
    priority: -1
    maps: { "r8": "prompt_r8" }
  random_9:
    pattern: "r9"
    priority: 6
    maps: { "r9": "prompt_r9" }
