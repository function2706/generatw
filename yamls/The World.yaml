        type2:
          pattern: '(.+?)\s+\(到着'
          capturegrp: 1
          import: [main, meta, location, outdoors, type1]
        type3:
          pattern: '\S+\s+-\s(.+?)\s-'
          capturegrp: 1
          import: [main, meta, location, outdoors, type1]
    weather:
