    vibe:
      pattern: '^.+?\s*(?:（([^）]+)）)?\s*\(好感度'
      capturegrp: 1
      maps:
        ご機嫌: (smile:1.1)
        フキゲン: (angry:1.1)
    affection:
      pattern: "好感度:\\s*([a-zA-Z]+)\\s*\\d+"
      capturegrp: 1
      ranges:
        looking at viewer: [Ex, SS, S, A]
        looking away: [F, G]
    trust:
      pattern: "信頼度:\\s*([a-zA-Z]+)\\s*\\d+"
      capturegrp: 1
      ranges:
        smile:
          negative: [F, G]
        disgusting:
          negative: [Ex, SS, S, A]
    frustration:
      pattern: '欲求不満度:\s*(\d+)％'
      capturegrp: 1
      intervals:
        blush: [60, 100]
        blush,in heat: [100, 10000]
    angry:
      pattern: '怒り:\s*(！*)|怒'
      capturegrp: 1
      maps:
        ！: jitome
        ！！: annoyed
        ！！！: angry
        ！！！！: (angry:1.1)
        ！！！！！: (angry:1.2)
        怒: (angry:1.2),v-shaped eyebrows
    in_heat:
      pattern: "発情中"
      maps:
        発情中: blush,in heat
    mood:
      pattern: 'ムード:\s*(OverDrive!!|❤*)'
      capturegrp: 1
      maps:
        ❤: (happy:0.9)
        ❤❤: happy
        ❤❤❤: happy
        ❤❤❤❤: happy,blush
        ❤❤❤❤❤: (happy:1.2),blush
        OverDrive!!: (happy:1.2),blush,seductive smile
    reason:
      pattern: '理性:\s*(LimitBreak!!|★*)'
      capturegrp: 1
      maps:
        ★:
          negative: (in heat:0.9)
        ★★:
          negative: in heat
        ★★★:
          negative: in heat,blush
        ★★★★:
          negative: (in heat:1.1),(blush:1.1)
        ★★★★★:
          negative: (in heat:1.2),(blush:1.2)
