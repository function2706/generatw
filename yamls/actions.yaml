# アクション定義 (全キャラ共通)
# ボタンとして UI に動的に並ぶ. 上から順に表示される.
# 新しいアクションはこのリストに追記するだけで増やせる.
# スキーマの詳細は yamls/character_yaml_spec.md を参照.
#
# effects  : パラメータ ID -> 変化 (scalar は +n / -n / =n, enum は値名)
# precondition : 条件を満たさないと locked (拒否) となり, effects/scene は適用されない
# scene    : そのアクション実行時にだけ一時付与するプロンプト
#            ※ 常に「対象キャラのみ」を映す方針のため, こちらの手や第三者を描写する
#              トークン (headpat, hug, 2人 など) は使わず, キャラ側の反応だけを書く.
# dialogue : ペルソナにセリフが無い場合のフォールバック (通常はペルソナ側が優先)
#            セリフ本体は yamls/personas.yaml を参照.

actions:
  - id: greet
    label: 挨拶
    scene: { positive: "waving, upper body, open mouth" }
    effects: { affection: +2, mood: happy }
    dialogue: ["こんにちは。", "やあ、来てくれたんだ。"]

  - id: talk
    label: 雑談
    scene: { positive: "talking, gentle expression, upper body" }
    effects: { affection: +1 }
    dialogue: ["ねえ、少し話そうよ。"]

  - id: compliment
    label: ほめる
    scene: { positive: "surprised, hand on own cheek, blush, upper body" }
    effects: { affection: +3, mood: shy }
    dialogue: ["えっ…そんなこと言われると照れるよ。"]

  - id: dress
    label: 着せ替え
    kind: wardrobe            # 「衣装」コンボの選択を反映する特別アクション
    dialogue: ["これに着替えればいい？", "どう…似合ってる？"]

  - id: headpat
    label: なでなで
    # 手は映さず, 撫でられている側の反応だけを描写する
    scene: { positive: "shy smile, closed eyes, blush, head tilt, upper body" }
    effects: { affection: +2, arousal: +5, mood: happy }
    precondition: { affection: { min: 15 } }
    dialogue: ["えへへ…なんだか、くすぐったいな。"]
    dialogue_locked: ["い、いきなりはびっくりするってば！"]

  - id: hug
    label: ハグ
    # 抱きつく相手は映さず, 照れた表情の寄りで表現する
    scene: { positive: "close-up, shy smile, closed eyes, blush, upper body" }
    effects: { affection: +3, arousal: +12 }
    precondition: { affection: { min: 40 } }
    dialogue: ["…あったかいね。もう少しだけ。"]
    dialogue_locked: ["ま、まだそういうのは早いってば…！"]

  - id: gift
    label: プレゼント
    scene: { positive: "holding a small gift box, sparkling eyes, happy, upper body" }
    effects: { affection: +5, mood: happy }
    dialogue: ["わたしに…？ ありがとう！"]

  - id: date
    label: お出かけ
    scene: { positive: "outdoors, town street, walking, happy, full body" }
    effects: { affection: +4, mood: happy }
    precondition: { affection: { min: 30 } }
    dialogue: ["お出かけ！ どこ行こうか。"]
    dialogue_locked: ["ふたりで出かけるのは…もう少し仲良くなってからね。"]

  - id: tease
    label: からかう
    scene: { positive: "pout, puffed cheeks, looking away, upper body" }
    effects: { mood: sulky, affection: -1 }
    dialogue: ["むー！ もう、いじわる。"]

  - id: goodnight
    label: おやすみ
    scene: { positive: "sleepy, soft light, bedroom, upper body" }
    effects: { mood: normal }
    dialogue: ["ふぁ…おやすみ。また明日ね。"]
