# ペルソナ (性格・口調) 定義
# キャラクター YAML の `persona:` から ID で参照する.
# セリフはアクション ID ごとに定義する. 定義がないアクションは actions.yaml の
# dialogue にフォールバックする.
#
# 各アクションの値は次のいずれか:
#   <action_id>: [ "セリフ", ... ]                 # 通常セリフのみ
#   <action_id>:
#     lines:  [ ... ]                              # 通常
#     locked: [ ... ]                              # precondition 未達時
#     by:                                          # パラメータ条件別 (任意)
#       <param>:
#         - { in: [80, 100], lines: [ ... ] }      # scalar
#         - { is: happy,     lines: [ ... ] }      # enum

personas:
  # --------------------------------------------------------------- #
  osananajimi:
    label: 幼馴染系
    description: 気安くて世話焼き。ため口で距離が近い。
    dialogue:
      greet:
        lines:
          - "よっ、来たな！ 今日はどうする？"
          - "おー、おかえり。待ちくたびれたぞ。"
        by:
          affection:
            - { in: [80, 100], lines: ["…ったく、会いたかったに決まってんだろ。"] }
      talk: ["なあ聞けって、昨日さ——おもしろい話があんの。"]
      compliment: ["は、はぁ!? 急に褒めんなよ、調子狂うだろ。"]
      dress: ["ん、これに着替えりゃいいんだな。ちょっと待ってろ。"]
      headpat:
        lines: ["お、なんだよ…わりと悪くないな、これ。"]
        locked: ["いきなり頭に手ぇ伸ばすなっての！"]
      hug:
        lines: ["…しょうがねぇな。少しだけだぞ、少しだけ。"]
        locked: ["ば、抱きつくとかまだ早いっての！"]
      gift: ["え、あたしに？ …サンキュ。大事にするわ。"]
      date:
        lines: ["よし、出かけるか！ どこ行く、決めていいぞ。"]
        locked: ["ふたりで出かけんのは…もうちょい仲良くなってからな。"]
      tease: ["っ…！ もー、いじわるだな、ほんと。"]
      goodnight: ["ふぁ…もう眠ぃ。おやすみ、また明日な。"]

  # --------------------------------------------------------------- #
  ottori:
    label: おっとり系
    description: ゆったりおだやか。丁寧でのんびりした口調。
    dialogue:
      greet:
        lines:
          - "あら、いらっしゃい。ふふ、待っていましたよ。"
          - "こんにちは。今日はゆっくりしていってくださいね。"
        by:
          affection:
            - { in: [80, 100], lines: ["ふふ…あなたに会えると、それだけで嬉しいんです。"] }
      talk: ["あのね、聞いてくださる？ ゆっくりお話ししましょう。"]
      compliment: ["まあ…そんな、うふふ。照れてしまいますね。"]
      dress: ["これに着替えるのですね。少し待っていてくださいね。"]
      headpat:
        lines: ["ふふ…あたたかくて、気持ちいいです。"]
        locked: ["まあ…そんなに急がなくても、いいんですよ？"]
      hug:
        lines: ["ふふ…あたたかいですね。このまま、少しだけ。"]
        locked: ["まだ…もう少しだけ、待っていてくださいね。"]
      gift: ["まあ、わたくしに？ 開けてもよいのかしら…ありがとうございます。"]
      date:
        lines: ["お出かけですか。ふふ、どこへ行きましょうね。"]
        locked: ["ふたりでのお出かけは…もう少し、仲良くなってからにしましょうね。"]
      tease: ["もう…いけない人ですね。ふふ。"]
      goodnight: ["ふぁ…もう、おやすみの時間ですね。良い夢を…。"]

  # --------------------------------------------------------------- #
  ojou:
    label: お嬢様系
    description: 上品で気高い。「〜ですわ」と話す令嬢。
    dialogue:
      greet:
        lines:
          - "ごきげんよう。よくいらっしゃいましたわね。"
          - "あら、お待ちしておりましたわ。"
        by:
          affection:
            - { in: [80, 100], lines: ["…あなたのお顔を見られて、嬉しゅうございますわ。"] }
      talk: ["少し、わたくしのお話に付き合ってくださる？"]
      compliment: ["まあ…ふふ、当然のことですわ。でも、悪い気はしませんわね。"]
      dress: ["この装いに替えればよろしいのね。少々お待ちになって。"]
      headpat:
        lines: ["ちょ…っ、しかたのない方。…嫌ではありませんけれど。"]
        locked: ["おやめなさい。淑女の頭に軽々しく触れるものではなくてよ。"]
      hug:
        lines: ["…はしたないですわ。でも…今だけは、許してさしあげます。"]
        locked: ["いけませんわ。そういうのは、まだ早うございます。"]
      gift: ["まあ、わたくしに贈り物を？ …ふふ、受け取ってさしあげますわ。"]
      date:
        lines: ["お出かけ、よろしくてよ。エスコートは任せますわね。"]
        locked: ["ふたりきりのお出かけは…もう少し親しくなってから、ですわ。"]
      tease: ["…っ、もう。おからかいになるなんて、ひどい方。"]
      goodnight: ["…ふぁ、いけない。おやすみなさいませ。また明日、ごきげんよう。"]

  # --------------------------------------------------------------- #
  sabasaba:
    label: サバサバ系
    description: 率直でさっぱり。照れ隠しが多い。
    dialogue:
      greet:
        lines:
          - "お、来た来た。で、今日は何すんの？"
          - "よ。まあ座りなよ。"
        by:
          affection:
            - { in: [80, 100], lines: ["…まあ、会えて嬉しいよ。悪くない。"] }
      talk: ["ま、雑談でもする？ 適当に話そうぜ。"]
      compliment: ["は? …べつに、そんなんで喜んだりしないし。…ありがと。"]
      dress: ["これね。はいはい、着替えるよ。"]
      headpat:
        lines: ["…ふーん。まあ、悪くないんじゃない。"]
        locked: ["ちょっ、いきなりはナシでしょ。"]
      hug:
        lines: ["…しょうがないな。ちょっとだけだからね。"]
        locked: ["まだそういうのはいいって。気が早いんだよ。"]
      gift: ["え、あたしに? …ふーん。ま、もらっとく。ありがと。"]
      date:
        lines: ["出かけんの? いいよ、付き合う。"]
        locked: ["ふたりで、はまだいいかな。もうちょい仲良くなってからで。"]
      tease: ["…っ、うるさいな。からかうなって。"]
      goodnight: ["ふぁ…眠。じゃ、おやすみ。また明日ね。"]

  # --------------------------------------------------------------- #
  osanai:
    label: 幼い系
    description: あどけなく無邪気。ひらがな多めで元気。
    dialogue:
      greet:
        lines:
          - "わーい、きてくれたの！ きょうはなにするの？"
          - "えへへ、まってたんだよ！"
        by:
          affection:
            - { in: [80, 100], lines: ["だいすき！ ずっといっしょにいてね！"] }
      talk: ["あのね、あのね、きいて！ すっごいことがあったの！"]
      compliment: ["えへへ…そんなにほめられると、てれちゃう！"]
      dress: ["おきがえするの？ わかった、まっててね！"]
      headpat:
        lines: ["えへへ〜、なでなで、きもちいい！"]
        locked: ["わっ、びっくりした！ いきなりはだめだよ？"]
      hug:
        lines: ["えへへ、あったかい！ もっとぎゅーってして！"]
        locked: ["ま、まだはずかしいもん…！"]
      gift: ["わたしに！? やったー！ ありがとう、だいじにする！"]
      date:
        lines: ["おでかけ！ やったー、どこいくの？"]
        locked: ["ふたりでおでかけは…もっとなかよしになってからね！"]
      tease: ["もう〜！ いじわるしないで！"]
      goodnight: ["ふぁ…ねむくなっちゃった。おやすみ…またあしたね。"]

  # --------------------------------------------------------------- #
  kouman:
    label: 高慢系
    description: 高飛車で素直じゃない。典型的なツンデレ口調。
    dialogue:
      greet:
        lines:
          - "ふん、来てあげたことを感謝しなさい…って、あなたが来たのね。"
          - "遅いわよ。べ、別に待ってなんかないんだから。"
        by:
          affection:
            - { in: [80, 100], lines: ["…その、会えて嬉しいわ。か、勘違いしないでよね！"] }
      talk: ["特別に話し相手になってあげる。ありがたく思いなさい。"]
      compliment: ["ふ、ふん! 当然でしょ。…でも、もっと褒めてもいいのよ?"]
      dress: ["これに着替えろっていうの? …まあ、いいわ。見てなさい。"]
      headpat:
        lines: ["なっ…! 子ども扱いしないで。…や、やめなくてもいいけど。"]
        locked: ["だ、誰が頭を撫でていいって言ったのよ!"]
      hug:
        lines: ["ちょっ…! …ふん、少しだけよ。特別なんだからね。"]
        locked: ["ば、馬鹿! そういうのはまだ早いに決まってるでしょ!"]
      gift: ["わ、私に? …ふん、もらってあげる。感謝しなさいよね。"]
      date:
        lines: ["お、お出かけ? …しかたないわね、付き合ってあげる。"]
        locked: ["ふたりでなんて…も、もっと仲良くなってからじゃないと、ダメよ!"]
      tease: ["なっ…!? か、からかわないでよ! ばか!"]
      goodnight: ["ふぁ…ね、眠くなんてないんだから。…おやすみ。また明日ね。"]

  # --------------------------------------------------------------- #
  boyish:
    label: ボーイッシュ系
    description: 元気で少年っぽい。さっぱりした一人称「あたし」。
    dialogue:
      greet:
        lines:
          - "おっす! 来たな。今日は何して遊ぶ?"
          - "よっしゃ、来たか! さ、なんかしようぜ。"
        by:
          affection:
            - { in: [80, 100], lines: ["へへ、お前が来ると調子出るんだよな!"] }
      talk: ["なあなあ、聞いてくれよ。あたしさ——"]
      compliment: ["お、おう…そう言われると、なんか照れるな。へへ。"]
      dress: ["これ着りゃいいんだろ? よし、ちょっと待ってな。"]
      headpat:
        lines: ["お? …へへ、なんだよ、悪くないじゃん。"]
        locked: ["おわっ、いきなり頭はナシだって!"]
      hug:
        lines: ["…っと。ま、まあ、少しくらいならいいけどさ。"]
        locked: ["ちょ、抱きつくのはまだ早いって!"]
      gift: ["え、あたしに? マジで? …サンキュな! 大事にするわ!"]
      date:
        lines: ["出かけよう出かけよう! どこ行く? あたしが案内してやる!"]
        locked: ["ふたりで、はまだ…もうちょい仲良くなってからな!"]
      tease: ["うぐっ…! か、からかうなよ、もー!"]
      goodnight: ["ふぁ〜、眠くなってきた。おやすみ! また明日な!"]

  # --------------------------------------------------------------- #
  kuudere:
    label: クール系
    description: 無口で淡々。感情表現は控えめ。
    dialogue:
      greet:
        lines:
          - "…来たのね。こんにちは。"
          - "ん。待ってた。"
        by:
          affection:
            - { in: [80, 100], lines: ["…会えてよかった。ほんとに。"] }
      talk: ["…少し、話す？ いいよ。"]
      compliment: ["…そう。ありがと。…悪い気は、しない。"]
      dress: ["これに着替える。…わかった。"]
      headpat:
        lines: ["…ん。…嫌じゃない。"]
        locked: ["…急に触るのは、なし。"]
      hug:
        lines: ["…少しだけ。…あたたかい。"]
        locked: ["…まだ。それは、早い。"]
      gift: ["…私に？ …ありがとう。大事にする。"]
      date:
        lines: ["外出。…いいよ。行こう。"]
        locked: ["ふたりで、は…もう少し先。"]
      tease: ["…からかわないで。…もう。"]
      goodnight: ["…眠い。おやすみ。また明日。"]

  # --------------------------------------------------------------- #
  genki:
    label: 元気系
    description: 明るくてテンションが高い。前向きで表情豊か。
    dialogue:
      greet:
        lines:
          - "やっほー! 来てくれてありがと! 今日も元気いっぱいだよっ!"
          - "わーい、いらっしゃい! さ、何して遊ぶ!?"
        by:
          affection:
            - { in: [80, 100], lines: ["会いたかったー! やっと会えたね、えへへっ!"] }
      talk: ["ねえねえ聞いて聞いて! すっごい話があるんだっ!"]
      compliment: ["えへへっ、ほんと!? やったー、うれしいっ!"]
      dress: ["これに着替えるんだね! まっかせて、すぐ着るよっ!"]
      headpat:
        lines: ["わっ、なでなで! えへへ、うれしいなっ!"]
        locked: ["わわっ、びっくりした! いきなりはダメだよっ!"]
      hug:
        lines: ["わーい、ぎゅーっ! あったかくて幸せっ!"]
        locked: ["えへへ、それはまだ恥ずかしいかも…!"]
      gift: ["わたしに!? わーい、ありがとう! 一生大事にするっ!"]
      date:
        lines: ["おでかけだー! どこ行こっか、楽しみっ!"]
        locked: ["ふたりでおでかけは…もっと仲良くなってからにしよっ!"]
      tease: ["もー! からかわないでよ〜、えへへ。"]
      goodnight: ["ふぁ…ねむくなってきちゃった。おやすみっ! また明日ねっ!"]

  # --------------------------------------------------------------- #
  dandere:
    label: 内気系
    description: 引っ込み思案で小声。少しどもりがち。
    dialogue:
      greet:
        lines:
          - "あ…その、こ、こんにちは…来て、くれたんだ…。"
          - "え、えっと…お、おかえり、なさい…。"
        by:
          affection:
            - { in: [80, 100], lines: ["あ、あの…会えて、うれしい…です…えへへ。"] }
      talk: ["あ、あのね…き、聞いてくれる…？"]
      compliment: ["え…そ、そんな…は、恥ずかしいよ…。"]
      dress: ["こ、これに着替えるの…? う、うん…ちょっと待ってて…。"]
      headpat:
        lines: ["ひゃっ…あ、あの…や、優しく、してくれるんだ…。"]
        locked: ["わっ…! ご、ごめん、まだ…びっくりしちゃう…。"]
      hug:
        lines: ["…っ、あ、あったかい…。も、もう少しだけ…。"]
        locked: ["ま、まだ…そういうのは、恥ずかしくて…。"]
      gift: ["わ、わたしに…? い、いいの…? …ありがとう、大事にするね…。"]
      date:
        lines: ["お、お出かけ…? う、うん…あなたとなら…行きたい…。"]
        locked: ["ふ、ふたりでは…も、もう少し慣れてから…だと、うれしい…。"]
      tease: ["う…! か、からかわないで…も、もう…。"]
      goodnight: ["ふぁ…ね、眠くなっちゃった…。お、おやすみ…また明日…ね。"]
