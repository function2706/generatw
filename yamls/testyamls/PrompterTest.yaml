interpreter: SampleInterpreter # どの Interpreter のための表なのかを記述する, これは Interpreter が予め提供する文字列とする
main: # ここも Interpreter が解釈できる Screen 名
  ignition: "(m|M)ain" # 発火条件は単項のみ
  name: # Interpreter へはこのルール名と pos/neg ごとの dict[Token, Weight] を渡す(マッチしなかった場合も含めて渡す)
    # YAML作成者は Interpreter が扱える(解釈できる)ルール名は予め知っておく必要がある
    # ただし解釈できないルールは無視されるだけとする
    pattern: 'name:\s(.+?),'
    capturegrp: 1 # 省略可能, その場合は 0 (全体キャプチャ)
    maps:
      Hogemaru: hogemaru # ポジティブプロンプト単項, weight=1.0 の場合
      Fugami: (fugami:1.2) # 重み付きトークン(この形式での記述とする理由は後述の ranges, intervals のため)
      Foota:
        positive: foota,(boy:1.1) # 組み合わせるとこんな感じ
        negative: barta # positive, negative の両取りが可能
    default: # 以上にマッチしなかった場合にこの記述があると, これをマッチ結果として渡す
      positive: smith # maps もこれも positive, negative のみの記述が可能
  season: # 予約語
    pattern: 'season:\s([0-9]{2})'
    capturegrp: 1
    ranges:
      spring: ["03", "04", "05"]
      summer:
        positive: ["07", "08", "09"]
        negative: cold # こういう表記も可能("07" がマッチした場合 pos に "summer", neg に "cold" が採用される)
      autumn: ["10", "11"]
      winter: ["02"]
      (winter:1.1),snow: ["12", "01"] # maps の値をベタ書きにするのはこういうパターンと整合性をとるため
      scorching heat:
        positive: cool
        negative: ["01", "02", "03", "04", "05", "06", "09", "10", "11", "12"] # negative を範囲指定する場合
        # ルール全体では "09" がマッチした場合, pos: (winter:1.1),snow.cool, neg: cold,scorching heat となる
        # 順番は記述順だが, 最終プロンプトの順番は Interpreter に委ねる
      H1:
        positive: ["04", "05", "06", "07", "08", "09"]
      H2:
        negative: ["04", "05", "06", "07", "08", "09"]
    default:
      positive: ordinary
      negative: storm
  vitality: # 予約語
    pattern: 'vitality:\s(.+?),'
    capturegrp: 1
    intervals: # 注意事項はほとんど ranges と同じだが, 値は str | tuple[float, float] のみ
      low:
        positive: [0, 50]
        negative: good
      high:
        positive: bad
        negative: [0, 70]
      middle: [40, 60]
      perfect:
        positive: [95, 100]
      ok:
        negative: [0, 40]
    default:
      negative: special
  fashion:
    upper: # 階層は任意
      pattern: 'upper:\s(.+?),'
      capturegrp: 1
      maps:
        Shirt: shirt
        T Shirt: t-shirt
    lower:
      pattern: 'lower:\s(.+?),'
      capturegrp: 1
      maps:
        Pants: pants
        Skirt: skirt
  common: # 必ず付与してほしいプロンプト(予約語)
    positive: common main positive # ここも positive のみとかにできる
    negative: common main negative
meta: # 予約語
  ignition: "(m|M)eta"
  weather: # 予約語
    pattern: 'weather:\s(.+?),'
    capturegrp: 1
    maps:
      sunny: sunny
      rainy: rainy
    default: cloudy
  location: # 予約語
    pattern: 'location:\s(.+?)'
    maps:
      room: room
      city: city
  common: common meta
sub:
  ignition: "(s|S)ub"
  ability:
    pattern: 'ability:\s(.+?),'
    capturegrp: 1
    maps:
      Strong: strong
      Intelligence: intelligence
  like:
    pattern: 'like:\s(.+?),'
    capturegrp: 1
    maps:
      Apple: apple
      Banana: banana
      Melon: melon
    default: nothing
  grade:
    pattern: 'grade:\s(.+?),'
    capturegrp: 1
    maps:
      "1": grade 1
      2: grade 2
  whole:
    pattern: "[wW]o[wW]!"
    maps:
      wow!: wow
      WoW!: WoW
  ng:
    pattern: 'ng:\s(.+?),'
    capturegrp: 2
    maps:
      dummy: Dummy
  ranges without default:
    pattern: 'rwd:\s(.+?),'
    capturegrp: 1
    ranges:
      dummy: ["a", "b"]
  intervals without default:
    pattern: 'iwd:\s(.+?),'
    capturegrp: 1
    ranges:
      dummy: [0, 10]
  # common は省略可能
common1:
  ignition: "common1"
  common: common1
common2:
  ignition: "common2"
  common:
    positive: common2
common3:
  ignition: "common3"
  common:
    negative: common3
common4:
  ignition: "common4"
  common:
    positive: common4-pos
    negative: common4-neg
import_src:
  ignition: "import_src"
  character:
    name:
      pattern: "name:(.+)"
      capturegrp: 1
      maps:
        Hogemaru: hogemaru
        Fugami: fugami
      default: smith
  partner:
    name:
      pattern: "NAME:(.+)"
      capturegrp: 1
      import: [import_src, character, name]
      default: zero
  flag:
    pattern: "flag"
    maps:
      flag: flag is true
  common:
    positive: import common pos
    negative: import common neg
import_dst1:
  ignition: "import_dst1"
  name:
    pattern: "NAME-(.+)"
    capturegrp: 1
    import: [import_src, character, name]
    default: alice
  common: [import_src]
import_dst2:
  ignition: "import_dst2"
  name:
    pattern: "Name>(.+)"
    capturegrp: 1
    import: [import_dst1, name]
    default: bob
  common: [import_dst1]
import_dst3:
  ignition: "import_dst3"
  name:
    import: [import_src, character, name]
    default: cate
  flag:
    import: [import_src, flag]
  common: [import_dst2]
import_dst4:
  ignition: "import_dst4"
  name:
    import: [import_dst3, name]
    default: doe
  flag:
    import: [import_dst3, flag]
  common: [import_dst3]
recursive:
  ignition: "recursive_plane"
  brackets_parentheses: # 再帰標準機能
    pattern: '\[([^\[\]]+?)\]'
    capturegrp: 1
    recurse:
      parentheses:
        pattern: '\(([^\(\)]+?)\)'
        capturegrp: 1
        maps:
          foo1: foo1
          foo2: foo2
          foo3: foo3
          bar1: bar1
          bar2: bar2
          bar3: bar3
          baz1: baz1
          baz2: baz2
          baz3: baz3
        default: foobar # 再帰先 default
  curlybrackets_parentheses: # 再帰構造のローカル import (pattern 省略は無意味な記法につき略)
    pattern: '\{([^\{\}]+?)\}'
    capturegrp: 1
    import: [recursive, brackets_parentheses]
recursive_import:
  ignition: "recursive_import"
  angles_parentheses: # 再帰構造のグローバル import
    pattern: "<([^<>]+?)>"
    capturegrp: 1
    import: [recursive, brackets_parentheses]
  brackets_parentheses: { import: [recursive, brackets_parentheses] } # 再帰構造のグローバル import (pattern 省略)
  angles:
    pattern: "<([^<>]+?)>"
    capturegrp: 1
    import: [recursive, brackets_parentheses, parentheses] # 再帰先 import
  parentheses: { import: [recursive, brackets_parentheses, parentheses] } # 再帰先 import (pattern 省略)
  slash_parentheses:
    pattern: "/([^/]+?)/"
    capturegrp: 1
    recurse:
      parentheses:
        import: [recursive, brackets_parentheses, parentheses] # 再帰先を別の再帰先 import で定義
recursives: # 2段以上の再帰
  ignition: "recursive_recursive"
  big:
    pattern: '\[([^\[\]]+?)\]'
    capturegrp: 1
    recurse:
      middle:
        pattern: '\{([^\{\}]+?)\}'
        capturegrp: 1
        recurse:
          small:
            pattern: '\(([^\(\)]+?)\)'
            capturegrp: 1
            import: [recursive, brackets_parentheses, parentheses]
recursive_name: # 再帰先の名前が再帰・分岐
  ignition: "recursive_name"
  big:
    pattern: '\[([^\[\]]+?)\]'
    capturegrp: 1
    recurse:
      child:
        parentheses:
          import: [recursive, brackets_parentheses, parentheses]
        angle:
          pattern: "<([^<>]+?)>"
          capturegrp: 1
          import: [recursive, brackets_parentheses, parentheses]
recursive_practice:
  ignition: "recursive_practice"
  equip:
    pattern: "equip:(.+)"
    capturegrp: 1
    recurse:
      equip_parts:
        pattern: '\[([^\[\]]+?)\]'
        capturegrp: 1
        maps:
          EQUIP1: EQUIP1
          EQUIP2: EQUIP2
          EQUIP3: EQUIP3
          EQUIP4: EQUIP4
recursive_report:
  ignition: "recursive_report"
  equip:
    pattern: "equip:(.+)"
    capturegrp: 1
    recurse:
      equip_parts_1:
        pattern: '\[([^\[\]]+?)\]'
        capturegrp: 1
        maps:
          EQUIP1: equip1
      equip_parts_2:
        pattern: '\[([^\[\]]+?)\]'
        capturegrp: 1
        maps:
          EQUIP2: equip2
      equip_parts_3:
        pattern: '\[([^\[\]]+?)\]'
        capturegrp: 1
        maps:
          EQUIP3: equip3
      equip_parts_4:
        pattern: '\[([^\[\]]+?)\]'
        capturegrp: 1
        maps:
          EQUIP4: equip4
