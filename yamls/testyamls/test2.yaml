all_in_one:
  ignition:
    any: ["start"]

  POSITIVE: "commonA"
  NEGATIVE: "commonN"

  # priority 早い
  p1:
    pattern: "name:(\\w+)"
    capturegrp: 1
    priority: 1
    maps:
      alice: "(girl:1.2)"
      bob:
        negative: "beard"

  # weight 上書き確認
  p2:
    pattern: "boost"
    priority: 2
    maps:
      boost: "(girl:1.5)"

  # ranges
  season:
    pattern: "month:(\\d+)"
    capturegrp: 1
    priority: 3
    ranges:
      spring:
        conditions: ["03", "04", "05"]
        negative: "snow"
      winter: ["12", "01", "02"]

  # 複数マッチ
  multi:
    pattern: "tag:(\\w+)"
    capturegrp: 1
    priority: 4
    maps:
      a: A
      b: B

  # 不一致 → default
  miss:
    pattern: "miss:(\\w+)"
    capturegrp: 1
    priority: 5
    maps:
      ok: OK
    default: DEF

  # マッチ無し → default 出ない確認
  nohit:
    pattern: "never:(\\w+)"
    capturegrp: 1
    priority: 6
    default: SHOULD_NOT

  # positive / negative 混在
  side:
    pattern: "side"
    priority: 7
    maps:
      side:
        positive: SIDE_P
        negative: SIDE_N
