main:
  ignition:
    any: ["today"]

  POSITIVE: "main_common_p"
  NEGATIVE: "main_common_n"

  # stable 持ち越しの代表
  who:
    pattern: "name:(\\w+)"
    capturegrp: 1
    priority: 1
    lifetime: stable
    maps:
      alice: alice
      bob: bob

  # weight 上書き用
  boost:
    pattern: "boost"
    priority: 2
    maps:
      boost: "(alice:1.5)"

  # ranges
  season:
    pattern: "m:(\\d+)"
    capturegrp: 1
    priority: 3
    lifetime: stable
    ranges:
      spring: ["03", "04", "05"]
      winter:
        positive: ["12", "01", "02"]
        negative: cold

  # default が出る
  vibe:
    pattern: "vibe:(\\w+)"
    capturegrp: 1
    priority: 4
    maps:
      happy: happy
    default: neutral

  # pattern ヒット無し → default 出ない確認
  never:
    pattern: "never:(\\w+)"
    capturegrp: 1
    priority: 5
    default: SHOULD_NOT

sub:
  ignition:
    all: ["sub", "go"]

  POSITIVE: "sub_common_p"
  NEGATIVE: "sub_common_n"

  mood:
    pattern: "mood:(\\w+)"
    capturegrp: 1
    priority: 1
    lifetime: stable
    maps:
      good: good
      bad:
        negative: BAD
    default: meh
