main:
  ignition:
    any: ["^\\s*\\S+\\s\\[LV"]
  character:
    name:
      pattern: "^(.+?)\\s*(?:（[^）]+）)?\\s*\\(好感度"
      priority: 1
      capturegrp: 1
      lifetime: stable
      maps:
        "博麗 霊夢": hakurei reimu
        Name2:
          positive: name2,feature2
          negative: NAME2
