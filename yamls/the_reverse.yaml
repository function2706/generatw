  meta:
    season:
      pattern: "(sunny|rainy)"
      priority: 2
      maps:
        sunny: sunny
        rainy: rainy
      default: cloudy
    time:
      pattern: "(1|2)[0-9]{3}/([0-9]{2})"
      priority: 4
      capturegrp: 2
      lifetime: stable
      ranges:
        spring: ["03", "04", "05", "06"]
        summer: ["07", "08"]
        autumn: ["09", "10"]
        winter:
          conditions: ["11", "12", "01", "02"]
          negative: HOT
    location:
      pattern: "(sunny|rainy)"
      priority: 2
      maps:
        sunny: sunny
        rainy: rainy
      default: cloudy
    weather:
      pattern: "(sunny|rainy)"
      priority: 2
      maps:
        sunny: sunny
        rainy: rainy
      default: cloudy
